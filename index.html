<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday CJ 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0a07;
    --cake-base: #7b3f20;
    --cake-frost: #f9d6b0;
    --cake-mid: #c0622a;
    --candle1: #e84393;
    --candle2: #4ecdc4;
    --candle3: #f9ca24;
    --candle4: #6c5ce7;
    --candle5: #ff6b6b;
    --gold: #f5c518;
    --cream: #fef5e4;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: 'Lato', sans-serif;
    overflow: hidden;
    user-select: none;
  }

  /* ── STARS ── */
  .stars {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    animation: twinkle var(--d, 3s) ease-in-out infinite alternate;
    opacity: var(--o, 0.4);
  }
  @keyframes twinkle { from { opacity: var(--o); } to { opacity: calc(var(--o) * 0.2); } }

  /* ── SCENE ── */
  .scene {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100vh; gap: 0;
  }

  /* ── TITLE ── */
  .title-area {
    text-align: center;
    margin-bottom: 12px;
    animation: fadeDown 1s ease both;
  }
  .subtitle {
    color: rgba(255,255,255,0.35);
    font-size: 0.75rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    margin-bottom: 6px;
    font-weight: 300;
  }
  .main-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 6vw, 3.8rem);
    color: var(--cream);
    line-height: 1.1;
  }
  .main-title span { color: var(--gold); font-style: italic; }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── GLOW AMBIENCE ── */
  .glow-orb {
    position: absolute;
    width: 320px; height: 180px;
    background: radial-gradient(ellipse, rgba(245,197,24,0.18) 0%, transparent 70%);
    bottom: 34%; left: 50%; transform: translateX(-50%);
    pointer-events: none;
    transition: opacity 1.2s ease;
  }

  /* ── CAKE SVG WRAPPER ── */
  .cake-wrap {
    animation: fadeUp 1.1s 0.3s ease both;
    filter: drop-shadow(0 30px 60px rgba(0,0,0,0.7));
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── CANDLE FLAMES ── */
  .flame {
    transform-origin: center bottom;
    animation: flicker 0.15s infinite alternate;
    transition: opacity 0.4s;
  }
  .flame-inner { animation: flickerI 0.12s infinite alternate; }

  @keyframes flicker {
    0%   { transform: scaleX(1)   scaleY(1)    rotate(-1deg); }
    33%  { transform: scaleX(0.88) scaleY(1.07) rotate(1.5deg); }
    66%  { transform: scaleX(1.06) scaleY(0.95) rotate(-0.5deg); }
    100% { transform: scaleX(0.94) scaleY(1.04) rotate(2deg); }
  }
  @keyframes flickerI {
    0%   { transform: scaleX(1)    scaleY(1); }
    50%  { transform: scaleX(0.9)  scaleY(1.1); }
    100% { transform: scaleX(1.05) scaleY(0.92); }
  }

  .flame.out { opacity: 0 !important; animation: none !important; }
  .smoke {
    opacity: 0;
    transition: opacity 0.3s;
    animation: none;
  }
  .smoke.show {
    opacity: 1;
    animation: smokeUp 1.6s ease-out forwards;
  }
  @keyframes smokeUp {
    0%   { opacity: 0.7; transform: translateY(0) scaleX(1); }
    100% { opacity: 0;   transform: translateY(-28px) scaleX(2.4); }
  }

  /* ── MIC BUTTON ── */
  .mic-area {
    margin-top: 18px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    animation: fadeUp 1.2s 0.6s ease both;
  }
  .mic-hint {
    color: rgba(255,255,255,0.4);
    font-size: 0.78rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    transition: opacity 0.4s;
  }

  .mic-btn {
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem;
    transition: transform 0.2s, border-color 0.3s, background 0.3s;
    backdrop-filter: blur(6px);
  }
  .mic-btn:hover { transform: scale(1.08); border-color: rgba(245,197,24,0.5); }
  .mic-btn.listening {
    border-color: var(--gold);
    background: rgba(245,197,24,0.12);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(245,197,24,0.4); }
    50%       { box-shadow: 0 0 0 14px rgba(245,197,24,0); }
  }

  /* ── VOLUME BAR ── */
  .vol-bar-wrap {
    width: 140px; height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.4s;
  }
  .vol-bar-wrap.show { opacity: 1; }
  .vol-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--gold), #ff9f43);
    border-radius: 2px;
    transition: width 0.08s linear;
  }

  /* ── REVEAL OVERLAY ── */
  .reveal {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(13,10,7,0.0);
    opacity: 0; pointer-events: none;
    transition: background 1.2s ease, opacity 0.8s ease;
  }
  .reveal.show {
    opacity: 1; pointer-events: all;
    background: rgba(13,10,7,0.88);
  }
  .reveal-inner {
    text-align: center;
    transform: scale(0.85) translateY(20px);
    opacity: 0;
    transition: transform 1s 0.5s cubic-bezier(0.34,1.56,0.64,1), opacity 0.8s 0.5s ease;
  }
  .reveal.show .reveal-inner { transform: scale(1) translateY(0); opacity: 1; }

  .reveal-emoji { font-size: 3.5rem; margin-bottom: 12px; display: block; animation: bounceIn 0.6s 1.1s ease both; }
  @keyframes bounceIn {
    0%   { transform: scale(0); }
    70%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .reveal-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.6rem, 7vw, 4.5rem);
    color: var(--gold);
    line-height: 1;
    margin-bottom: 10px;
  }
  .reveal-title em { font-style: italic; color: var(--cream); }
  .reveal-msg {
    color: rgba(255,255,255,0.7);
    font-size: 1rem;
    font-weight: 300;
    letter-spacing: 0.04em;
    max-width: 340px;
    line-height: 1.7;
    margin-bottom: 28px;
  }
  .replay-btn {
    padding: 10px 28px;
    border: 1px solid rgba(245,197,24,0.5);
    background: transparent;
    color: var(--gold);
    border-radius: 100px;
    font-family: 'Lato', sans-serif;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .replay-btn:hover { background: var(--gold); color: var(--bg); }

  /* ── CONFETTI ── */
  .confetti-container {
    position: fixed; inset: 0; pointer-events: none; z-index: 99; overflow: hidden;
  }
  .conf {
    position: absolute;
    top: -12px;
    width: var(--w); height: var(--h);
    background: var(--c);
    border-radius: var(--r);
    animation: confFall var(--dur) var(--del) ease-in forwards;
  }
  @keyframes confFall {
    0%   { transform: translateX(0) translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateX(var(--dx)) translateY(110vh) rotate(var(--rot)); opacity: 0.3; }
  }
</style>
</head>
<body>

<!-- Stars -->
<div class="stars" id="stars"></div>

<!-- Confetti -->
<div class="confetti-container" id="confetti"></div>

<!-- Glow -->
<div class="glow-orb" id="glowOrb"></div>

<!-- Main scene -->
<div class="scene">
  <div class="title-area">
    <p class="subtitle">a little something for</p>
    <h1 class="main-title">Happy Birthday, <span>CJ</span></h1>
  </div>

  <!-- CAKE SVG -->
  <div class="cake-wrap">
    <svg id="cake" width="340" height="280" viewBox="0 0 340 280" fill="none" xmlns="http://www.w3.org/2000/svg">

      <!-- Plate shadow -->
      <ellipse cx="170" cy="262" rx="110" ry="10" fill="rgba(0,0,0,0.35)"/>

      <!-- Cake bottom layer -->
      <rect x="50" y="195" width="240" height="60" rx="6" fill="#7b3f20"/>
      <rect x="50" y="195" width="240" height="18" rx="0" fill="#6d3419"/>
      <!-- Frosting drips bottom -->
      <path d="M60 195 Q70 182 80 195 Q90 182 100 195 Q110 182 120 195 Q130 182 140 195 Q150 182 160 195 Q170 182 180 195 Q190 182 200 195 Q210 182 220 195 Q230 182 240 195 Q250 182 260 195 Q270 182 280 195" stroke="#f9d6b0" stroke-width="11" fill="none" stroke-linecap="round"/>

      <!-- Cake top layer -->
      <rect x="75" y="135" width="190" height="64" rx="6" fill="#9b4f28"/>
      <rect x="75" y="135" width="190" height="16" rx="0" fill="#8a4222"/>
      <!-- Frosting drips top -->
      <path d="M85 135 Q93 123 101 135 Q109 123 117 135 Q125 123 133 135 Q141 123 149 135 Q157 123 165 135 Q173 123 181 135 Q189 123 197 135 Q205 123 213 135 Q221 123 229 135 Q237 123 245 135 Q253 123 261 135" stroke="#f9d6b0" stroke-width="10" fill="none" stroke-linecap="round"/>

      <!-- Decorative dots -->
      <circle cx="100" cy="167" r="5" fill="#ff6b9d" opacity="0.9"/>
      <circle cx="130" cy="161" r="4" fill="#4ecdc4" opacity="0.9"/>
      <circle cx="160" cy="167" r="5" fill="#f9ca24" opacity="0.9"/>
      <circle cx="190" cy="161" r="4" fill="#a29bfe" opacity="0.9"/>
      <circle cx="220" cy="167" r="5" fill="#fd79a8" opacity="0.9"/>
      <circle cx="115" cy="215" r="6" fill="#74b9ff" opacity="0.8"/>
      <circle cx="155" cy="210" r="5" fill="#55efc4" opacity="0.8"/>
      <circle cx="195" cy="215" r="6" fill="#fdcb6e" opacity="0.8"/>
      <circle cx="235" cy="210" r="5" fill="#ff7675" opacity="0.8"/>

      <!-- Candle 1 (pink) -->
      <g id="candle-group-0">
        <rect x="104" y="106" width="12" height="32" rx="3" fill="#e84393"/>
        <rect x="104" y="106" width="12" height="8" rx="1" fill="rgba(255,255,255,0.25)"/>
        <!-- wick -->
        <line x1="110" y1="106" x2="110" y2="100" stroke="#555" stroke-width="1.5"/>
        <!-- flame -->
        <g class="flame" id="flame-0" transform-origin="110 100">
          <ellipse cx="110" cy="94" rx="6" ry="9" fill="#ff9f43" opacity="0.9"/>
          <g class="flame-inner">
            <ellipse cx="110" cy="95" rx="3.5" ry="6" fill="#f9ca24"/>
            <ellipse cx="110" cy="96" rx="2" ry="3.5" fill="#fff5cc"/>
          </g>
        </g>
        <ellipse class="smoke" id="smoke-0" cx="110" cy="100" rx="3" ry="2" fill="rgba(180,180,180,0.6)"/>
      </g>

      <!-- Candle 2 (teal) -->
      <g id="candle-group-1">
        <rect x="131" y="100" width="12" height="38" rx="3" fill="#4ecdc4"/>
        <rect x="131" y="100" width="12" height="8" rx="1" fill="rgba(255,255,255,0.25)"/>
        <line x1="137" y1="100" x2="137" y2="94" stroke="#555" stroke-width="1.5"/>
        <g class="flame" id="flame-1" transform-origin="137 94">
          <ellipse cx="137" cy="88" rx="6" ry="9" fill="#ff9f43" opacity="0.9"/>
          <g class="flame-inner">
            <ellipse cx="137" cy="89" rx="3.5" ry="6" fill="#f9ca24"/>
            <ellipse cx="137" cy="90" rx="2" ry="3.5" fill="#fff5cc"/>
          </g>
        </g>
        <ellipse class="smoke" id="smoke-1" cx="137" cy="94" rx="3" ry="2" fill="rgba(180,180,180,0.6)"/>
      </g>

      <!-- Candle 3 (yellow) center -->
      <g id="candle-group-2">
        <rect x="158" y="96" width="12" height="42" rx="3" fill="#f9ca24"/>
        <rect x="158" y="96" width="12" height="8" rx="1" fill="rgba(255,255,255,0.25)"/>
        <line x1="164" y1="96" x2="164" y2="90" stroke="#555" stroke-width="1.5"/>
        <g class="flame" id="flame-2" transform-origin="164 90">
          <ellipse cx="164" cy="84" rx="6" ry="9" fill="#ff9f43" opacity="0.9"/>
          <g class="flame-inner">
            <ellipse cx="164" cy="85" rx="3.5" ry="6" fill="#f9ca24"/>
            <ellipse cx="164" cy="86" rx="2" ry="3.5" fill="#fff5cc"/>
          </g>
        </g>
        <ellipse class="smoke" id="smoke-2" cx="164" cy="90" rx="3" ry="2" fill="rgba(180,180,180,0.6)"/>
      </g>

      <!-- Candle 4 (purple) -->
      <g id="candle-group-3">
        <rect x="185" y="100" width="12" height="38" rx="3" fill="#6c5ce7"/>
        <rect x="185" y="100" width="12" height="8" rx="1" fill="rgba(255,255,255,0.25)"/>
        <line x1="191" y1="100" x2="191" y2="94" stroke="#555" stroke-width="1.5"/>
        <g class="flame" id="flame-3" transform-origin="191 94">
          <ellipse cx="191" cy="88" rx="6" ry="9" fill="#ff9f43" opacity="0.9"/>
          <g class="flame-inner">
            <ellipse cx="191" cy="89" rx="3.5" ry="6" fill="#f9ca24"/>
            <ellipse cx="191" cy="90" rx="2" ry="3.5" fill="#fff5cc"/>
          </g>
        </g>
        <ellipse class="smoke" id="smoke-3" cx="191" cy="94" rx="3" ry="2" fill="rgba(180,180,180,0.6)"/>
      </g>

      <!-- Candle 5 (red) -->
      <g id="candle-group-4">
        <rect x="212" y="106" width="12" height="32" rx="3" fill="#ff6b6b"/>
        <rect x="212" y="106" width="12" height="8" rx="1" fill="rgba(255,255,255,0.25)"/>
        <line x1="218" y1="106" x2="218" y2="100" stroke="#555" stroke-width="1.5"/>
        <g class="flame" id="flame-4" transform-origin="218 100">
          <ellipse cx="218" cy="94" rx="6" ry="9" fill="#ff9f43" opacity="0.9"/>
          <g class="flame-inner">
            <ellipse cx="218" cy="95" rx="3.5" ry="6" fill="#f9ca24"/>
            <ellipse cx="218" cy="96" rx="2" ry="3.5" fill="#fff5cc"/>
          </g>
        </g>
        <ellipse class="smoke" id="smoke-4" cx="218" cy="100" rx="3" ry="2" fill="rgba(180,180,180,0.6)"/>
      </g>

      <!-- Plate -->
      <ellipse cx="170" cy="255" rx="106" ry="10" fill="#d4a76a" opacity="0.6"/>
      <ellipse cx="170" cy="255" rx="100" ry="7" fill="#c8956c" opacity="0.4"/>
    </svg>
  </div>

  <!-- Mic area -->
  <div class="mic-area">
    <p class="mic-hint" id="micHint">Tap the mic & blow out the candles 🎤</p>
    <button class="mic-btn" id="micBtn" title="Start listening">🎤</button>
    <div class="vol-bar-wrap" id="volBarWrap">
      <div class="vol-bar" id="volBar"></div>
    </div>
  </div>
</div>

<!-- Reveal overlay -->
<div class="reveal" id="reveal">
  <div class="reveal-inner">
    <span class="reveal-emoji">🎉</span>
    <h2 class="reveal-title">Happy Birthday,<br><em>CJ!</em></h2>
    <p class="reveal-msg">
      Wishing you a day as bright and wonderful<br>as you are. Cheers to another amazing year! 🥂
    </p>
    <button class="replay-btn" id="replayBtn">↺ &nbsp; Replay</button>
  </div>
</div>

<script>
// ── STARS ──
const starsEl = document.getElementById('stars');
for (let i = 0; i < 120; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random() * 2.5 + 0.5;
  s.style.cssText = `
    left:${Math.random()*100}%;
    top:${Math.random()*100}%;
    width:${size}px; height:${size}px;
    --d:${(Math.random()*3+1.5).toFixed(1)}s;
    --o:${(Math.random()*0.5+0.1).toFixed(2)};
    animation-delay:${(Math.random()*4).toFixed(1)}s;
  `;
  starsEl.appendChild(s);
}

// ── STATE ──
const TOTAL = 5;
let extinguished = 0;
let listening = false;
let audioCtx, analyser, source;
let blowTimeout = null;
let blowStreak = 0;

const flames = Array.from({length: TOTAL}, (_, i) => document.getElementById(`flame-${i}`));
const smokes = Array.from({length: TOTAL}, (_, i) => document.getElementById(`smoke-${i}`));
const micBtn = document.getElementById('micBtn');
const micHint = document.getElementById('micHint');
const volBar = document.getElementById('volBar');
const volBarWrap = document.getElementById('volBarWrap');
const revealEl = document.getElementById('reveal');
const glowOrb = document.getElementById('glowOrb');

// ── MIC ──
micBtn.addEventListener('click', async () => {
  if (listening) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    source = audioCtx.createMediaStreamSource(stream);
    source.connect(analyser);

    listening = true;
    micBtn.classList.add('listening');
    micBtn.textContent = '🫁';
    micHint.textContent = 'Now blow! 💨';
    volBarWrap.classList.add('show');
    detectBlow();
  } catch(e) {
    micHint.textContent = "Mic access denied 😢 Try a modern browser";
  }
});

function detectBlow() {
  if (!listening) return;
  const buf = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(buf);

  // Average volume
  const avg = buf.reduce((a, b) => a + b, 0) / buf.length;
  const pct = Math.min(avg / 60 * 100, 100);
  volBar.style.width = pct + '%';

  // Blow threshold
  if (avg > 22) {
    blowStreak++;
    if (blowStreak > 3 && extinguished < TOTAL) {
      blowStreak = 0;
      extinguishNext();
    }
  } else {
    blowStreak = Math.max(0, blowStreak - 1);
  }

  requestAnimationFrame(detectBlow);
}

function extinguishNext() {
  const i = extinguished;
  flames[i].classList.add('out');
  smokes[i].classList.add('show');
  extinguished++;

  // Dim glow gradually
  const glowOpacity = 1 - (extinguished / TOTAL);
  glowOrb.style.opacity = glowOpacity;

  // Update hint
  const left = TOTAL - extinguished;
  if (left > 0) {
    micHint.textContent = `${left} candle${left > 1 ? 's' : ''} left — keep blowing! 💨`;
  }

  // Reset smoke class after animation
  setTimeout(() => smokes[i].classList.remove('show'), 1800);

  if (extinguished >= TOTAL) {
    setTimeout(showReveal, 800);
  }
}

// ── CONFETTI ──
function spawnConfetti() {
  const container = document.getElementById('confetti');
  container.innerHTML = '';
  const colors = ['#f9ca24','#e84393','#4ecdc4','#6c5ce7','#ff6b6b','#74b9ff','#55efc4','#fdcb6e','#a29bfe','#fd79a8'];
  for (let i = 0; i < 120; i++) {
    const c = document.createElement('div');
    c.className = 'conf';
    const isRect = Math.random() > 0.4;
    c.style.cssText = `
      left: ${Math.random()*100}%;
      --w: ${isRect ? (Math.random()*8+6)+'px' : (Math.random()*7+5)+'px'};
      --h: ${isRect ? (Math.random()*5+3)+'px' : (Math.random()*7+5)+'px'};
      --c: ${colors[Math.floor(Math.random()*colors.length)]};
      --r: ${isRect ? '2px' : '50%'};
      --dur: ${(Math.random()*1.5+1.8).toFixed(2)}s;
      --del: ${(Math.random()*1.2).toFixed(2)}s;
      --dx: ${(Math.random()*200-100).toFixed(0)}px;
      --rot: ${(Math.random()*720-360).toFixed(0)}deg;
    `;
    container.appendChild(c);
  }
}

function showReveal() {
  spawnConfetti();
  revealEl.classList.add('show');
  listening = false;
  micHint.textContent = '🎉 All candles out!';
}

// ── REPLAY ──
document.getElementById('replayBtn').addEventListener('click', () => {
  extinguished = 0;
  listening = false;
  blowStreak = 0;
  flames.forEach(f => f.classList.remove('out'));
  smokes.forEach(s => { s.classList.remove('show'); });
  revealEl.classList.remove('show');
  document.getElementById('confetti').innerHTML = '';
  glowOrb.style.opacity = 1;
  micBtn.classList.remove('listening');
  micBtn.textContent = '🎤';
  micHint.textContent = 'Tap the mic & blow out the candles 🎤';
  volBarWrap.classList.remove('show');
  volBar.style.width = '0%';

  // Re-init audio if context was created
  if (audioCtx) {
    audioCtx.close();
    audioCtx = null; analyser = null; source = null;
  }
});
</script>
</body>
</html>
