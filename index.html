<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday CJ 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0a07;
    --cake-base: #7b3f20;
    --cake-frost: #f9d6b0;
    --gold: #f5c518;
    --cream: #fef5e4;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: 'Lato', sans-serif;
    overflow: hidden;
    user-select: none;
  }

  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star {
    position: absolute; border-radius: 50%; background: white;
    animation: twinkle var(--d, 3s) ease-in-out infinite alternate;
    opacity: var(--o, 0.4);
  }
  @keyframes twinkle { from { opacity: var(--o); } to { opacity: calc(var(--o) * 0.2); } }

  .scene {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100vh; gap: 0;
  }

  .title-area {
    text-align: center; margin-bottom: 10px;
    animation: fadeDown 1s ease both;
  }
  .subtitle {
    color: rgba(255,255,255,0.35); font-size: 0.75rem;
    letter-spacing: 0.35em; text-transform: uppercase;
    margin-bottom: 6px; font-weight: 300;
  }
  .main-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 5vw, 3.2rem);
    color: var(--cream); line-height: 1.1;
  }
  .main-title span { color: var(--gold); font-style: italic; }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .glow-orb {
    position: absolute; width: 380px; height: 160px;
    background: radial-gradient(ellipse, rgba(245,197,24,0.15) 0%, transparent 70%);
    bottom: 32%; left: 50%; transform: translateX(-50%);
    pointer-events: none; transition: opacity 1.2s ease;
  }

  .cake-wrap {
    animation: fadeUp 1.1s 0.3s ease both;
    filter: drop-shadow(0 20px 50px rgba(0,0,0,0.7));
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Flames */
  .flame {
    transform-origin: center bottom;
    animation: flicker 0.15s infinite alternate;
    transition: opacity 0.35s;
  }
  .flame-inner { animation: flickerI 0.12s infinite alternate; }
  @keyframes flicker {
    0%   { transform: scaleX(1)    scaleY(1)    rotate(-1deg); }
    33%  { transform: scaleX(0.88) scaleY(1.07) rotate(1.5deg); }
    66%  { transform: scaleX(1.06) scaleY(0.95) rotate(-0.5deg); }
    100% { transform: scaleX(0.94) scaleY(1.04) rotate(2deg); }
  }
  @keyframes flickerI {
    0%   { transform: scaleX(1)   scaleY(1); }
    50%  { transform: scaleX(0.9) scaleY(1.1); }
    100% { transform: scaleX(1.05) scaleY(0.92); }
  }
  .flame.out { opacity: 0 !important; animation: none !important; }
  .smoke { opacity: 0; transition: opacity 0.3s; animation: none; }
  .smoke.show { opacity: 1; animation: smokeUp 1.6s ease-out forwards; }
  @keyframes smokeUp {
    0%   { opacity: 0.7; transform: translateY(0) scaleX(1); }
    100% { opacity: 0;   transform: translateY(-22px) scaleX(2.4); }
  }

  /* Mic */
  .mic-area {
    margin-top: 14px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    animation: fadeUp 1.2s 0.6s ease both;
  }
  .mic-hint {
    color: rgba(255,255,255,0.4); font-size: 0.78rem;
    letter-spacing: 0.15em; text-transform: uppercase; transition: opacity 0.4s;
    text-align: center;
  }
  .mic-btn {
    width: 60px; height: 60px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    transition: transform 0.2s, border-color 0.3s, background 0.3s;
    backdrop-filter: blur(6px);
  }
  .mic-btn:hover { transform: scale(1.08); border-color: rgba(245,197,24,0.5); }
  .mic-btn.listening {
    border-color: var(--gold); background: rgba(245,197,24,0.12);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(245,197,24,0.4); }
    50%       { box-shadow: 0 0 0 14px rgba(245,197,24,0); }
  }

  .vol-bar-wrap {
    width: 160px; height: 4px;
    background: rgba(255,255,255,0.08); border-radius: 2px;
    overflow: hidden; opacity: 0; transition: opacity 0.4s;
  }
  .vol-bar-wrap.show { opacity: 1; }
  .vol-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--gold), #ff9f43);
    border-radius: 2px; transition: width 0.08s linear;
  }

  /* Reveal */
  .reveal {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(13,10,7,0.0);
    opacity: 0; pointer-events: none;
    transition: background 1.2s ease, opacity 0.8s ease;
  }
  .reveal.show { opacity: 1; pointer-events: all; background: rgba(13,10,7,0.88); }
  .reveal-inner {
    text-align: center;
    transform: scale(0.85) translateY(20px); opacity: 0;
    transition: transform 1s 0.5s cubic-bezier(0.34,1.56,0.64,1), opacity 0.8s 0.5s ease;
  }
  .reveal.show .reveal-inner { transform: scale(1) translateY(0); opacity: 1; }
  .reveal-emoji { font-size: 3.5rem; margin-bottom: 12px; display: block; animation: bounceIn 0.6s 1.1s ease both; }
  @keyframes bounceIn {
    0%   { transform: scale(0); }
    70%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .reveal-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.6rem, 7vw, 4.5rem);
    color: var(--gold); line-height: 1; margin-bottom: 10px;
  }
  .reveal-title em { font-style: italic; color: var(--cream); }
  .reveal-msg {
    color: rgba(255,255,255,0.7); font-size: 1rem; font-weight: 300;
    letter-spacing: 0.04em; max-width: 340px; line-height: 1.7; margin-bottom: 28px;
  }
  .replay-btn {
    padding: 10px 28px; border: 1px solid rgba(245,197,24,0.5);
    background: transparent; color: var(--gold); border-radius: 100px;
    font-family: 'Lato', sans-serif; font-size: 0.8rem;
    letter-spacing: 0.2em; text-transform: uppercase;
    cursor: pointer; transition: background 0.2s, color 0.2s;
  }
  .replay-btn:hover { background: var(--gold); color: var(--bg); }

  .confetti-container { position: fixed; inset: 0; pointer-events: none; z-index: 99; overflow: hidden; }
  .conf {
    position: absolute; top: -12px;
    width: var(--w); height: var(--h);
    background: var(--c); border-radius: var(--r);
    animation: confFall var(--dur) var(--del) ease-in forwards;
  }
  @keyframes confFall {
    0%   { transform: translateX(0) translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateX(var(--dx)) translateY(110vh) rotate(var(--rot)); opacity: 0.3; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="confetti-container" id="confetti"></div>
<div class="glow-orb" id="glowOrb"></div>

<div class="scene">
  <div class="title-area">
    <p class="subtitle">a little something for</p>
    <h1 class="main-title">Happy Birthday, <span>CJ</span> 🎂</h1>
  </div>

  <!-- CAKE SVG — wider to fit 15 candles -->
  <div class="cake-wrap">
    <svg id="cake" width="480" height="260" viewBox="0 0 480 260" fill="none" xmlns="http://www.w3.org/2000/svg">

      <!-- Plate shadow -->
      <ellipse cx="240" cy="248" rx="150" ry="10" fill="rgba(0,0,0,0.35)"/>

      <!-- Bottom cake layer -->
      <rect x="30" y="178" width="420" height="62" rx="6" fill="#7b3f20"/>
      <rect x="30" y="178" width="420" height="16" rx="0" fill="#6d3419"/>
      <path d="M40 178 Q52 165 64 178 Q76 165 88 178 Q100 165 112 178 Q124 165 136 178 Q148 165 160 178 Q172 165 184 178 Q196 165 208 178 Q220 165 232 178 Q244 165 256 178 Q268 165 280 178 Q292 165 304 178 Q316 165 328 178 Q340 165 352 178 Q364 165 376 178 Q388 165 400 178 Q412 165 424 178 Q436 165 448 178" stroke="#f9d6b0" stroke-width="10" fill="none" stroke-linecap="round"/>

      <!-- Top cake layer -->
      <rect x="55" y="122" width="370" height="60" rx="6" fill="#9b4f28"/>
      <rect x="55" y="122" width="370" height="14" rx="0" fill="#8a4222"/>
      <path d="M65 122 Q76 110 87 122 Q98 110 109 122 Q120 110 131 122 Q142 110 153 122 Q164 110 175 122 Q186 110 197 122 Q208 110 219 122 Q230 110 241 122 Q252 110 263 122 Q274 110 285 122 Q296 110 307 122 Q318 110 329 122 Q340 110 351 122 Q362 110 373 122 Q384 110 395 122 Q406 110 415 122" stroke="#f9d6b0" stroke-width="9" fill="none" stroke-linecap="round"/>

      <!-- Deco dots bottom layer -->
      <circle cx="80"  cy="205" r="5" fill="#ff6b9d" opacity="0.85"/>
      <circle cx="120" cy="199" r="4" fill="#4ecdc4" opacity="0.85"/>
      <circle cx="160" cy="205" r="5" fill="#f9ca24" opacity="0.85"/>
      <circle cx="200" cy="199" r="4" fill="#a29bfe" opacity="0.85"/>
      <circle cx="240" cy="205" r="5" fill="#fd79a8" opacity="0.85"/>
      <circle cx="280" cy="199" r="4" fill="#74b9ff" opacity="0.85"/>
      <circle cx="320" cy="205" r="5" fill="#55efc4" opacity="0.85"/>
      <circle cx="360" cy="199" r="4" fill="#fdcb6e" opacity="0.85"/>
      <circle cx="400" cy="205" r="5" fill="#ff7675" opacity="0.85"/>

      <!-- 15 CANDLES — evenly spaced across top layer -->
      <!-- Colors cycle through 5 colors -->
      <!-- Generated via JS below, but SVG defined here statically -->
      <!-- Candle positions: x = 72, 104, 136, 168, 200, 216, 240, 264, 280, 312, 344, 376, ... -->
      <!-- Let's do spacing: start=75, step=24, 15 candles => 75,99,123,147,171,195,219,243,267,291,315,339,363,387,411 -->

      <!-- We'll define candle bodies + wicks here, flames generated by JS -->
      <g id="candles"></g>

      <!-- Plate -->
      <ellipse cx="240" cy="242" rx="148" ry="9" fill="#d4a76a" opacity="0.5"/>
    </svg>
  </div>

  <div class="mic-area">
    <p class="mic-hint" id="micHint">Tap the mic & blow out all 15 candles! 🎤</p>
    <button class="mic-btn" id="micBtn" title="Start listening">🎤</button>
    <div class="vol-bar-wrap" id="volBarWrap">
      <div class="vol-bar" id="volBar"></div>
    </div>
  </div>
</div>

<div class="reveal" id="reveal">
  <div class="reveal-inner">
    <span class="reveal-emoji">🎉</span>
    <h2 class="reveal-title">Happy 15th,<br><em>CJ!</em></h2>
    <p class="reveal-msg">
      Wishing you the most amazing 15th birthday! 🥂<br>
      Here's to bigger adventures and even better memories ahead.
    </p>
    <button class="replay-btn" id="replayBtn">↺ &nbsp; Replay</button>
  </div>
</div>

<script>
// ── STARS ──
const starsEl = document.getElementById('stars');
for (let i = 0; i < 120; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random() * 2.5 + 0.5;
  s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;--d:${(Math.random()*3+1.5).toFixed(1)}s;--o:${(Math.random()*0.5+0.1).toFixed(2)};animation-delay:${(Math.random()*4).toFixed(1)}s;`;
  starsEl.appendChild(s);
}

// ── BUILD 15 CANDLES IN SVG ──
const TOTAL = 15;
const candleColors = ['#e84393','#4ecdc4','#f9ca24','#6c5ce7','#ff6b6b','#74b9ff','#55efc4','#fdcb6e','#a29bfe','#fd79a8','#badc58','#f0932b','#eb4d4b','#22a6b3','#be2edd'];
const startX = 75, stepX = 24;
// Alternating heights for visual interest
const heights = [32,38,34,40,32,38,36,42,34,38,32,40,36,34,38];

const candlesGroup = document.getElementById('candles');
const flameEls = [];
const smokeEls = [];

for (let i = 0; i < TOTAL; i++) {
  const cx = startX + i * stepX;
  const h = heights[i];
  const candleTop = 122 - h; // sits on top of cake top layer
  const wickTop = candleTop - 5;
  const flameY = wickTop - 9;
  const col = candleColors[i];

  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  g.id = `candle-group-${i}`;
  g.innerHTML = `
    <rect x="${cx-5}" y="${candleTop}" width="10" height="${h}" rx="2.5" fill="${col}"/>
    <rect x="${cx-5}" y="${candleTop}" width="10" height="7" rx="1" fill="rgba(255,255,255,0.22)"/>
    <line x1="${cx}" y1="${candleTop}" x2="${cx}" y2="${wickTop}" stroke="#555" stroke-width="1.2"/>
    <g class="flame" id="flame-${i}" style="transform-origin:${cx}px ${wickTop}px">
      <ellipse cx="${cx}" cy="${flameY}" rx="5" ry="8" fill="#ff9f43" opacity="0.9"/>
      <g class="flame-inner">
        <ellipse cx="${cx}" cy="${flameY+1}" rx="3" ry="5.5" fill="#f9ca24"/>
        <ellipse cx="${cx}" cy="${flameY+2}" rx="1.8" ry="3" fill="#fff5cc"/>
      </g>
    </g>
    <ellipse class="smoke" id="smoke-${i}" cx="${cx}" cy="${wickTop}" rx="2.5" ry="1.8" fill="rgba(180,180,180,0.6)"/>
  `;
  candlesGroup.appendChild(g);
  flameEls.push(document.getElementById(`flame-${i}`));
  smokeEls.push(document.getElementById(`smoke-${i}`));
}

// ── STATE ──
let extinguished = 0;
let listening = false;
let audioCtx, analyser, source;
let blowStreak = 0;

const micBtn   = document.getElementById('micBtn');
const micHint  = document.getElementById('micHint');
const volBar   = document.getElementById('volBar');
const volBarWrap = document.getElementById('volBarWrap');
const revealEl = document.getElementById('reveal');
const glowOrb  = document.getElementById('glowOrb');

// ── BLOW THRESHOLDS — require sustained, real blowing ──
const BLOW_THRESHOLD = 38;   // min average amplitude (0-255) — raised from 22
const STREAK_NEEDED  = 8;    // frames of sustained blow needed before extinguishing

// ── MIC ──
micBtn.addEventListener('click', async () => {
  if (listening) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    source = audioCtx.createMediaStreamSource(stream);
    source.connect(analyser);

    listening = true;
    micBtn.classList.add('listening');
    micBtn.textContent = '🫁';
    micHint.textContent = 'Now blow hard! 💨';
    volBarWrap.classList.add('show');
    detectBlow();
  } catch(e) {
    micHint.textContent = "Mic access denied 😢 Try Chrome or Safari";
  }
});

function detectBlow() {
  if (!listening || extinguished >= TOTAL) return;

  const buf = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(buf);

  // Focus on lower-mid frequencies (breath/wind is typically 200–2000 Hz)
  // fftSize=512 → 256 bins, each ~86Hz wide at 44100Hz sample rate
  // bins 2–23 cover roughly 170Hz–2000Hz (the "blow" zone)
  const blowBins = Array.from(buf.slice(2, 24));
  const avg = blowBins.reduce((a, b) => a + b, 0) / blowBins.length;

  const pct = Math.min(avg / 80 * 100, 100);
  volBar.style.width = pct + '%';

  if (avg > BLOW_THRESHOLD) {
    blowStreak++;
    if (blowStreak >= STREAK_NEEDED && extinguished < TOTAL) {
      blowStreak = 0;
      extinguishNext();
    }
  } else {
    blowStreak = Math.max(0, blowStreak - 2);
  }

  requestAnimationFrame(detectBlow);
}

function extinguishNext() {
  const i = extinguished;
  flameEls[i].classList.add('out');
  smokeEls[i].classList.add('show');
  extinguished++;

  glowOrb.style.opacity = Math.max(0, 1 - extinguished / TOTAL);
  const left = TOTAL - extinguished;
  if (left > 0) {
    micHint.textContent = `${left} candle${left > 1 ? 's' : ''} left — keep going! 💨`;
  }

  setTimeout(() => smokeEls[i].classList.remove('show'), 1800);
  if (extinguished >= TOTAL) setTimeout(showReveal, 900);
}

// ── CONFETTI ──
function spawnConfetti() {
  const container = document.getElementById('confetti');
  container.innerHTML = '';
  const colors = ['#f9ca24','#e84393','#4ecdc4','#6c5ce7','#ff6b6b','#74b9ff','#55efc4','#fdcb6e','#a29bfe','#fd79a8'];
  for (let i = 0; i < 160; i++) {
    const c = document.createElement('div');
    c.className = 'conf';
    const isRect = Math.random() > 0.4;
    c.style.cssText = `left:${Math.random()*100}%;--w:${isRect?(Math.random()*8+6)+'px':(Math.random()*7+5)+'px'};--h:${isRect?(Math.random()*5+3)+'px':(Math.random()*7+5)+'px'};--c:${colors[Math.floor(Math.random()*colors.length)]};--r:${isRect?'2px':'50%'};--dur:${(Math.random()*1.5+1.8).toFixed(2)}s;--del:${(Math.random()*1.2).toFixed(2)}s;--dx:${(Math.random()*200-100).toFixed(0)}px;--rot:${(Math.random()*720-360).toFixed(0)}deg;`;
    container.appendChild(c);
  }
}

function showReveal() {
  spawnConfetti();
  revealEl.classList.add('show');
  listening = false;
  micHint.textContent = '🎉 All 15 candles out!';
}

// ── REPLAY ──
document.getElementById('replayBtn').addEventListener('click', () => {
  extinguished = 0; listening = false; blowStreak = 0;
  flameEls.forEach(f => f.classList.remove('out'));
  smokeEls.forEach(s => s.classList.remove('show'));
  revealEl.classList.remove('show');
  document.getElementById('confetti').innerHTML = '';
  glowOrb.style.opacity = 1;
  micBtn.classList.remove('listening');
  micBtn.textContent = '🎤';
  micHint.textContent = 'Tap the mic & blow out all 15 candles! 🎤';
  volBarWrap.classList.remove('show');
  volBar.style.width = '0%';
  if (audioCtx) { audioCtx.close(); audioCtx = null; analyser = null; source = null; }
});
</script>
</body>
</html>
